[package]
name = "spectral_similarity"
version = "0.7.0"
edition = "2021"

[lib]
name = "spectral_similarity"
crate-type = ["cdylib"]
path = "src/entropy_lib.rs"

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "0.22", features = ["derive", "dtype-struct"] }
polars = { version = "0.49.1", features = ["dtype-struct", "dtype-full"] }
rayon = "1.10.0"

[build-dependencies]
pyo3-build-config = "0.21.2"