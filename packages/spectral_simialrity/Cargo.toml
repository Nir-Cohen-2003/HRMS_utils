[package]
name = "spectral_similarity"
version = "0.1.0"
edition = "2024"

[lib]
name = "spectral_similarity"
crate-type = ["cdylib"]
path = "src/entropy_lib.rs"

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "0.24", features = ["derive", "dtype-struct"] }
polars = { version = "0.51.0", features = ["dtype-struct", "dtype-full"] }
polars-arrow = "0.51.0"
rayon = "1.11.0"
pyo3-ffi = "0.25.0"
[build-dependencies]
pyo3-build-config = "0.21.2"