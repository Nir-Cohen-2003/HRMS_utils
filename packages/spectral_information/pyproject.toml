
[project]
name = "spectral_information"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.34.0"]
build-backend = "maturin"
[tool.maturin]
module-name = "spectral_information._internal_spectral_information"
