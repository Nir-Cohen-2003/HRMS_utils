[package]
name = "spectral_information"
version = "0.1.0"
edition = "2024"

[features]
default = []
polars_global_allocator = []

[lib]
name = "spectral_information"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "*", features = ["dtype-struct","dtype-array", "dtype-full"] }
pyo3 = { version = "*", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "*", features = ["derive", "dtype-struct","dtype-full", "dtype-array"] }
polars-arrow = { version = "*", default-features = false }
pyo3-ffi = "*"
rayon = "*"
serde = { version = "1", features = ["derive"] }
itertools = "*"
mass_decomposition = { path = "../mass_decomposition" }
