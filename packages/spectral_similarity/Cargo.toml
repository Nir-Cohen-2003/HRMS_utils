[package]
name = "spectral-similarity"
version = "0.3.0"
edition = "2024"

[lib]
name = "_internal"
crate-type= ["cdylib"]
path = "src/entropy_lib.rs"

[dependencies]
pyo3 = { version = "*", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "*", features = ["derive", "dtype-struct"] }
polars = { version = "*", features = ["dtype-struct", "dtype-full"] }
serde = { version = "1", features = ["derive"] }
polars-arrow = { version = "*", default-features = false }
rayon = "*"
pyo3-ffi = "*"
