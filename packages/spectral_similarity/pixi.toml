[workspace]
channels = ["https://prefix.dev/conda-forge","https://prefix.dev/nir-cohen"]
platforms = ["linux-64","win-64"]
preview = ["pixi-build"]
[package]
name = "spectral_similarity"
version = "0.3.0"
description = "A rust package for spectral similarity"
authors = []

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[tasks]
publish-prefix = {cmd="rattler-build upload prefix --channel nir-cohen"}
publish-anaconda = {cmd="rattler-build upload anaconda --owner Nir_Cohen --channel main"}
[dependencies]
rattler-build = ">=0.1.0"
rust = ">=1.70"
compilers = "*"
cargo-bundle-licenses = "*"
maturin = ">=1.0"

[package.host-dependencies] 
maturin = ">=1.0,<2.0"

[package.run-dependencies]
polars = ">=1.34.0"

[environments]
default = {features = [], solve-group = "default"}
testing = {features = ["testing"], solve-group = "testing"}

[feature.testing.tasks]
test = "pytest tests/test_spectral_similarity.py"
compare_nist = "python tests/compare_to_nist.py"
dotprod = "pytest tests/nist_dot_prod_match.py"
[feature.testing.dependencies]
polars = ">=1.33.0,<2"
python = ">=3.9"
pip = ">=23.0"
numpy = ">=1.24.0"
spectral_similarity = {path = "."}
pytest = ">=7.0"
optuna = ">=3.0"