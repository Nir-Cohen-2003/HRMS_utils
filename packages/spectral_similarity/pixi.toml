[workspace]
channels = ["https://prefix.dev/conda-forge","https://prefix.dev/nir-cohen"]
platforms = ["linux-64"]
preview = ["pixi-build"]
[package]
name = "spectral_similarity"
version = "0.1.0"
description = "A rust package for spectral similarity"
authors = []

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[tasks]
build = "rattler-build build --recipe recipe/recipe.yaml"
publish-prefix = {cmd="rattler-build upload prefix --channel nir-cohen"}
publish-anaconda = {cmd="rattler-build upload anaconda --owner Nir_Cohen --channel main"}
[dependencies]
rattler-build = ">=0.1.0"
rust = ">=1.70"
compilers = "*"
cargo-bundle-licenses = "*"
maturin = ">=1.0"


[environments]
default = {features = [], solve-group = "default"}
testing = {features = ["testing"], solve-group = "testing"}

[feature.testing.tasks]
test = "python tests/test_spectral_similarity.py"
[feature.testing.dependencies]
polars = ">=1.33.0,<2"
python = ">=3.8"
pip = ">=23.0"
# spectral_similarity = {path = "."}
spectral_similarity = "*"
