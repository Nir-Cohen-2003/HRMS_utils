[workspace]
channels = ["https://prefix.dev/conda-forge","https://prefix.dev/nir-cohen"]
platforms = ["linux-64","win-64"]
preview = ["pixi-build"]
[package]
name = "hrms_core"
version = "0.1.0"
license = "Apache-2.0"
license-file = "LICENSE"
description = "A rust package for hrms core functionalities"
authors = []

[package.build]
backend = { name = "pixi-build-python", version = "*" ,channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]}
[package.build.config]
noarch = false
[workspace.build-variants]
python = ["3.10", "3.11", "3.12", "3.13","3.14"]

[tasks]
cibw-wheels = { cmd = "python -m cibuildwheel --output-dir dist", env = {CIBW_BUILD = " cp310-* cp311-* cp312-* cp313-* cp314-*", CIBW_SKIP = "*musllinux* *-win32", CIBW_ARCHS_WINDOWS = "AMD64", CIBW_PACKAGE = "."}, depends-on=["clean_dist"]}
clean_dist = "rm -rf dist || true"


publish-testpypi = {cmd="twine upload --repository testpypi --skip-existing dist/*", depends-on = ["cibw-wheels"]}
publish-pypi = {cmd="twine upload --repository pypi --skip-existing dist/*", depends-on = ["cibw-wheels"]}

publish-prefix = {cmd="rattler-build upload prefix --channel nir-cohen"}
publish-anaconda = {cmd="rattler-build upload anaconda --owner Nir_Cohen --channel main"}



[dependencies]
python = ">=3.9.0"
pip = "*"
cibuildwheel = "*"
rattler-build = ">=0.48.0"

[package.build-dependencies]
rattler-build = ">=0.48.0"
rust = ">=1.91.0"
rust-src = "*"
compilers = "*"
cargo-bundle-licenses = "*"
maturin = ">=1.09.0"
[package.host-dependencies] 
maturin = ">=1.09.0,<2.0"

[package.run-dependencies]
polars = ">=1.34.0"

[environments]
default = {features = [], solve-group = "default"}
testing = {features = ["testing"], solve-group = "testing"}

[feature.testing.tasks]
test_all = {depends-on = ["test_mass_decomposition", "test_spectral_information", "test_spectral_similarity"]}
test_mass_decomposition = {cmd = ["pytest", "-vv", "tests/test_mass_decomposition.py"] ,env = { POLARS_VERBOSE= "1" }}
test_spectral_information = {cmd = ["pytest", "tests/test_spectral_information.py"] ,env = { POLARS_VERBOSE= "1" }}
test_spectral_similarity = {cmd = ["pytest", "tests/test_spectral_similarity.py"] ,env = { POLARS_VERBOSE= "1" }}

compare_to_nist_dotprod = {cmd = "python tests/compare_to_nist_dotprod.py", env = { POLARS_VERBOSE= "1" }}

benchmark_spectrum_decomposition = {cmd = "python benchmarks/benchmark_spectrum_decomposition.py --no-mass", env = { POLARS_VERBOSE= "1" }}
benchmark_mass_and_spectrum_decomposition = {cmd = "python benchmarks/benchmark_spectrum_decomposition.py", env = { POLARS_VERBOSE= "1" }}

[feature.testing.dependencies]
hrms_core = {path = "."}
polars = ">=1.35.0,<2"
python = ">=3.9"
pip = ">=23.0"
numpy = ">=1.24.0"
pytest = ">=7.0"
