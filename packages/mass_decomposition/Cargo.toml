[package]
name = "mass_decomposition"
version = "0.1.0"
edition = "2024"

[lib]
name = "mass_decomposition"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "*", features = ["serde", "rayon"] }
pyo3 = { version = "*", features = ["extension-module"] }
pyo3-polars = { version = "*", features = ["derive"] }
polars-arrow = { version = "*", default-features = false }
pyo3-ffi = "*"
rayon = "*"
serde = { version = "1", features = ["derive"] }
num-traits = "*"
num-integer = "*"
once_cell = "*"


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mass_decomposition_benchmark"
harness = false
