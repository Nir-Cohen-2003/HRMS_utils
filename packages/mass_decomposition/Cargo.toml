[package]
name = "mass_decomposition"
version = "0.1.0"
edition = "2024"

[lib]
name = "mass_decomposition"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "*", features = ["dtype-struct","dtype-array", "dtype-full"] }
pyo3 = { version = "*", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "*", features = ["derive", "dtype-struct","dtype-full", "dtype-array"] }
polars-arrow = { version = "*", default-features = false }
pyo3-ffi = "*"
rayon = "*"
serde = { version = "1", features = ["derive"] }
num-traits = "*"
num-integer = "*"
once_cell = "*"
itertools = "*"


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

