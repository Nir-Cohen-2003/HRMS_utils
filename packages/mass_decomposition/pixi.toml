[workspace]
channels = ["https://prefix.dev/conda-forge","https://prefix.dev/nir-cohen"]
platforms = ["linux-64","win-64"]
preview = ["pixi-build"]
[package]
name = "mass_decomposition"
version = "0.1.0"
description = "A rust package for mass decomposition"
authors = []

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[tasks]
publish-prefix = {cmd="rattler-build upload prefix --channel nir-cohen"}
publish-anaconda = {cmd="rattler-build upload anaconda --owner Nir_Cohen --channel main"}
[dependencies]
rattler-build = ">=0.1.0"
rust = ">=1.70"
compilers = "*"
cargo-bundle-licenses = "*"
maturin = ">=1.0"

[package.host-dependencies] 
maturin = ">=1.0,<2.0"

[package.run-dependencies]
polars = ">=1.34.0"

[environments]
default = {features = [], solve-group = "default"}
testing = {features = ["testing"], solve-group = "testing"}

[feature.testing.tasks]
test_all = {cmd = ["pytest", "tests/"] ,env = { POLARS_VERBOSE= "1" }}
test_simple= {cmd = "python tests/test_mass_decomposition.py", env ={ POLARS_VERBOSE= "1" }}
benchmark = {cmd = "python benchmarks/benchmark_spectrum_decomposition.py", env = { POLARS_VERBOSE= "1" }}
[feature.testing.dependencies]
polars = ">=1.35.0,<2"
python = ">=3.9"
pip = ">=23.0"
numpy = ">=1.24.0"
mass_decomposition = {path = "."}
pytest = ">=7.0"
