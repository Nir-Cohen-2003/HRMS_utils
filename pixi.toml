[workspace]
channels = [
  "https://prefix.dev/conda-forge",
  "conda-forge",
  "bioconda",
  # "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/nir-cohen",
  "https://prefix.dev/skill-forge"
]
platforms = ["linux-64"]#,"win-64"]
preview = ["pixi-build"]
[package]
name = "hrms_utils"
version = "0.10.0"
license = "Apache-2.0"
license-file = "LICENSE"
authors = ["Nir Cohen"]
[dependencies]
python = "*"


[pypi-dependencies]
build = "*"

[tasks]
publish-testpypi = {cmd="twine upload --repository testpypi --skip-existing dist/*", depends-on = ["build-all"]}
publish-pypi = {cmd="twine upload --repository pypi --skip-existing dist/*", depends-on = ["build-all"]}

publish-prefix = {cmd="rattler-build upload prefix --channel nir-cohen"}
publish-anaconda = {cmd="rattler-build upload anaconda --owner Nir_Cohen --channel main"}

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*"}

[feature.testing.tasks]
check = "pyrefly check --ignore missing-import"
check_all = "pyrefly check ./src/hrms_utils --ignore missing-import --ignore missing-module-attribute"
check_nist_mspec = "pyrefly check ./src/hrms_utils/formats/nist_mspec.py"
test = {cmd="echo 'All tests passed!'", depends-on = [
    "test_isotopic_pattern",
    "test_mass_decomposition",
    "test_mzml",
    "test_core_spectral_information",
    "test_spectral_similarity",
    "test_thermo",
    "test_nist_mspec",
    "test_chromatogram",
    "test_msdial_cli",
    "test_info_score",
    # "test_mol",
  ]}
test_isotopic_pattern = "pytest tests/hrms_core/test_isotopic_pattern.py"
test_mass_decomposition = "pytest tests/hrms_core/test_mass_decomposition.py"
test_mzml = "pytest tests/hrms_core/test_mzml_io.py"
test_core_spectral_information = "pytest tests/hrms_core/test_spectral_information.py"
test_spectral_similarity = "pytest tests/hrms_core/test_spectral_similarity.py"
test_thermo = "pytest tests/hrms_core/test_thermo_io.py"
test_nist_mspec = {cmd="python tests/formats/test_nist_mspec.py",env={ POLARS_VERBOSE= "1" }}
test_chromatogram = {cmd="python tests/formats/chromatogram.py",env ={ POLARS_VERBOSE= "0" }}
test_msdial_cli = "pytest tests/formats/test_msdial_cli.py -v -s"
# test_mol = "python tests/rdkit/mol.py"
test_info_score = "python tests/spectral/test_spectral_information.py"



[feature.testing.target.linux-64.dependencies]
hrms_utils = {path = "."}
parallel_rdkit =  {path = "../parallel_rdkit"}
numba = ">=0.61.0"
pytest = ">=8.4.2,<9"
optuna = "*"
requests = "*"
marimo ="*"
ruff = "*"
pyrefly = "*"
thermorawfileparser = "*"

[feature.experiments.target.linux-64.dependencies]
hrms_utils = {path = "."}
parallel_rdkit =  {path = "../parallel_rdkit"}
pyzmq = "*"
marimo ="*"
memory_profiler = "*"
cupy = "*"
numba = "*"
cuda-version = "*"
nvmolkit = "*"

[feature.experiments.tasks]
approx_sim = {cmd="python experiments/fast_cosine_sim/approximate_similarity.py",env={ MKL_INTERFACE_LAYER = "LP64"}}
approx_sim_batched  = {cmd="python experiments/fast_cosine_sim/batched_gpu.py",env={ MKL_INTERFACE_LAYER = "LP64"}}
benchmark_gpu_cosine = {cmd="python experiments/fast_cosine_sim/simms_sparse_exact_benchmark.py",env={ MKL_INTERFACE_LAYER = "LP64"}}

isotope_fit = "python experiments/find_optimal_isotopic_parameters.py"

[feature.scripts.tasks]
plasma-fpr = {cmd = "python experiments/spectral_information/plasma_fpr_estimate.py"}
process-pubchem = "python scripts/process_pubchem.py"
process-pubchem-download = "python scripts/process_pubchem.py --download"
check_spectral_library = "python scripts/check_spectral_library.py data/ -p data/pubchem.parquet"
notebook = {cmd="marimo edit test.py",env={MARIMO_OUTPUT_MAX_BYTES="100_000_000"}}
[feature.scripts.target.linux-64.dependencies]
hrms_utils = {path = "."}
parallel_rdkit = {path = "../parallel_rdkit"}
thermorawfileparser = "*"
[feature.scripts.dependencies]
marimo = "*"
altair = ">=5.4.0"
vegafusion = "*"
vl-convert-python=">=1.9.0"
dataframely = ">=2.7.0,<3"

[feature.docs.dependencies]
mkdocs = ">=1.5.0"
pymdown-extensions="*"
mkdocs-material = ">=9.5.0"
mkdocstrings = ">=0.24.0"
mkdocstrings-python = ">=1.7.0"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
docs-deploy = "mkdocs gh-deploy"

[feature.frag_trees.target.linux-64.dependencies]
hrms_utils = {path = "."}
parallel_rdkit = {path = "../parallel_rdkit"}
numba = ">=0.61.0"
networkx = ">=3.0"
matplotlib = ">=3.8.0"

[feature.frag_trees.tasks]
build_tree = "python experiments/frag_trees/fragmentation_tree.py"
build_tree_molecule = "python experiments/frag_trees/build_tree_for_molecule.py"

[environments]
default = {features = [], solve-group = "default"}
testing = {features = ["testing"], solve-group = "testing"}
experiments = {features = ["experiments"], solve-group = "experiments",no-default-feature = true}
scripts = {features = ["scripts"], solve-group = "scripts"}
docs = {features = ["docs"], solve-group = "docs"}
frag-trees = {features = ["frag_trees"], solve-group = "frag_trees"}
