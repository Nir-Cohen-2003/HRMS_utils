context:
  name: hrms_utils
  version: 0.7.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script: build.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - python
    - pip
    - maturin >=1.0
    - setuptools >=68.0.0
    - cython >=3.0.0

  host:
    - python
    - pip
    - numpy >=1.20.0
    - setuptools >=68.0.0
    - cython >=3.0.0
    - polars
    - pyarrow

  run:
    - python
    - polars >=1.33.0,<2
    - rdkit >=2024.0.0
    - numpy >=1.20.0
    - numba >=0.61.0
    - ms_entropy
    - scipy
    - requests
    - aiohttp
    - pyarrow
    - pandas
    - python-calamine
    - openpyxl
    - xlsx2csv
    - xlsxwriter
    - connectorx
    - sqlalchemy

about:
  summary: "Utils for working with high-resolution mass spectrometry (HRMS) data"
  license: MIT
