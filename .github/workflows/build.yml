name: Build Package

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install pixi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
            irm https://pixi.sh/install.ps1 | iex
            echo "$HOME\.pixi\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure Docker (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
          fi
          # Start docker if not already running
          (sudo systemctl start docker 2>/dev/null || sudo service docker start 2>/dev/null || true)
          docker --version
          docker info || true

      - name: Show pixi version
        run: pixi --version

      - name: Build wheels with cibuildwheel
        run: pixi run cibw-wheels

      - name: Build sdist (only on Linux)
        if: runner.os == 'Linux'
        run: pixi run sdist

      - name: Build conda package
        run: pixi build

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

      - name: Upload conda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: ./*.conda

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    # Trusted Publishing environment registered in TestPyPI
    environment: build package
    permissions:
      id-token: write   # Mandatory for OIDC / Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List collected files
        run: ls -l dist

      - name: Install twine (for validation only)
        run: python -m pip install -U twine

      - name: Verify distributions
        run: twine check dist/*

      - name: Publish package distributions to TestPyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
        continue-on-error: true

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    # Trusted Publishing environment registered in PyPI
    environment: release
    permissions:
      id-token: write   # Mandatory for OIDC / Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List collected files
        run: ls -l dist

      - name: Install twine (for validation only)
        run: python -m pip install -U twine

      - name: Verify distributions
        run: twine check dist/*

      - name: Publish package distributions to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true

  publish-prefix:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: conda-prefix
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install rattler-build
        run: pixi global install rattler-build

      - uses: actions/download-artifact@v4
        with:
          path: .
          pattern: conda-*
          merge-multiple: true

      - name: List conda packages
        run: ls -l *.conda

      - name: Publish to prefix.dev
        run: |
          for package in *.conda; do
            pixi run publish-prefix --api-key "${{ secrets.PREFIX_API_KEY }}" "$package"
          done
        continue-on-error: true

  publish-anaconda:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: conda-anaconda
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install rattler-build
        run: pixi global install rattler-build

      - uses: actions/download-artifact@v4
        with:
          path: .
          pattern: conda-*
          merge-multiple: true

      - name: List conda packages
        run: ls -l *.conda

      - name: Publish to Anaconda.org
        run: |
          for package in *.conda; do
            pixi run publish-anaconda --api-key "${{ secrets.ANACONDA_API_TOKEN }}" "$package"
          done
        continue-on-error: true