name: Build and Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.59.0
          cache: true

      - name: Show pixi version
        run: pixi --version

      - name: Run tests
        run: pixi run test

      - name: Build wheels
        run: pixi run cibw-wheels

      - name: Build sdist
        run: pixi run sdist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist

      - name: Build conda packages
        run: pixi build
        shell: bash

      - name: Upload conda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conda-dist-${{ matrix.os }}
          path: |
            **/*.conda

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Download all conda artifacts
        uses: actions/download-artifact@v4
        with:
          path: conda-dist
          pattern: conda-dist-*
          merge-multiple: true
      
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.59.0
          cache: true

      - name: Publish to prefix.dev and Anaconda.org
        run: |
          for package in conda-dist/**/*.conda; do
            pixi run publish-prefix --api-key "${{ secrets.PREFIX_API_KEY }}" "$package"
            pixi run publish-anaconda --api-key "${{ secrets.ANACONDA_API_KEY }}" "$package"
          done
        shell: bash
