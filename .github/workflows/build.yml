name: Build Package

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build-and-publish-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Ensure Docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
          fi
          # Why: Start docker if not already running for cibuildwheel container builds
          (sudo systemctl start docker 2>/dev/null || sudo service docker start 2>/dev/null || true)
          docker --version
          docker info || true

      - name: Show pixi version
        run: pixi --version

      - name: Build wheels with cibuildwheel
        run: pixi run cibw-wheels

      - name: Build sdist
        run: pixi run sdist

      - name: Build conda package
        run: pixi build

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

      - name: Upload conda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conda-linux
          path: ./*.conda

      - name: Publish to TestPyPI (Trusted Publishing)
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
        continue-on-error: true

      - name: Publish to PyPI (Trusted Publishing)
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true

      - name: Install rattler-build
        if: github.event_name == 'release'
        run: pixi global install rattler-build

      - name: List conda packages
        if: github.event_name == 'release'
        run: ls -l ./*.conda

      - name: Publish to prefix.dev
        if: github.event_name == 'release'
        run: |
          for package in ./*.conda; do
            pixi run publish-prefix --api-key "${{ secrets.PREFIX_API_KEY }}" "$package"
          done
        continue-on-error: true

      - name: Publish to Anaconda.org
        if: github.event_name == 'release'
        run: |
          for package in ./*.conda; do
            pixi run publish-anaconda --api-key "${{ secrets.ANACONDA_API_KEY }}" "$package"
          done
        continue-on-error: true

  build-and-publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        shell: pwsh
        run: |
          irm https://pixi.sh/install.ps1 | iex
          echo "$HOME\.pixi\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show pixi version
        run: pixi --version

      - name: Build wheels with cibuildwheel
        run: pixi run cibw-wheels

      - name: Build conda package
        run: pixi build

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/

      - name: Upload conda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conda-windows
          path: ./*.conda

      - name: Publish to TestPyPI (Trusted Publishing)
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
        continue-on-error: true

      - name: Publish to PyPI (Trusted Publishing)
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true

      - name: Install rattler-build
        if: github.event_name == 'release'
        run: pixi global install rattler-build

      - name: List conda packages
        if: github.event_name == 'release'
        shell: pwsh
        run: Get-ChildItem -Path . -Filter *.conda | Format-Table Name, Length

      - name: Publish to prefix.dev
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter *.conda | ForEach-Object {
            pixi run publish-prefix --api-key "${{ secrets.PREFIX_API_KEY }}" $_.FullName
          }
        continue-on-error: true

      - name: Publish to Anaconda.org
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter *.conda | ForEach-Object {
            pixi run publish-anaconda --api-key "${{ secrets.ANACONDA_API_KEY }}" $_.FullName
          }
        continue-on-error: true