name: Build and Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            curl -fsSL https://pixi.sh/install.sh | bash
            echo "$HOME/.pixi/bin" >> $GITHUB_PATH
          elif [ "$RUNNER_OS" == "Windows" ]; then
            irm https://pixi.sh/install.ps1 | iex
            echo "$HOME\.pixi\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          fi
        shell: bash

      - name: Show pixi version
        run: pixi --version

      # - name: Run tests
      #   run: pixi run -e testing test

      - name: Build wheels
        run: pixi run cibw-wheels
        env:
          # Set the packages to build
          CIBW_PACKAGE: "packages/mass_decomposition packages/spectral_information packages/spectral_similarity ."
          CIBW_SKIP: "*-win32 *musllinux*"

      - name: Build sdist
        run: pixi run sdist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
