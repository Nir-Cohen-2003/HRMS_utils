[package]
name = "hrms_utils"
version = "0.8.0"
edition = "2024"
rust-version = "1.90"
[lib]
name = "hrms_core"
crate-type = ["rlib","cdylib"]
path = "src/hrms_core/lib.rs"
[dependencies]
polars = { version = "*", features = ["dtype-struct","dtype-array", "dtype-full"] }
pyo3 = { version = "*", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "*", features = ["derive", "dtype-struct","dtype-full", "dtype-array"] }
polars-arrow = { version = "*", default-features = false }
pyo3-ffi = "*"
rayon = "*"
serde = { version = "1", features = ["derive"] }
num-traits = "*"
num-integer = "*"
once_cell = "*"
itertools = "*"
