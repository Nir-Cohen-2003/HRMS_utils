[project]
name = "hrms_utils"
version = "0.7.0"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.33.0,<2",
    "rdkit>=2024.0.0",
    "numpy>=1.20.0",
    "numba>=0.61.0",
    "ms_entropy",
    "requests",
    "aiohttp",
    "scipy",
    # for polars
    "pyarrow>=12.0.0",
    "pandas",
    "openpyxl",
    "python-calamine",
    "xlsx2csv",
    "xlsxwriter",
    "connectorx",
    "sqlalchemy",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.13.2", "wheel"]


